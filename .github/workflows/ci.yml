# Cada push a la rama `frontend`: dependencias limpias, lint, build y audit.
# Audit en "critical": lo que queda en high (braces, vía http-proxy-middleware)
# no tiene versión corregida y no es explotable con rutas fijas.
name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

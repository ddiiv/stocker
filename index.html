<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stocker — Panel de gestión</title>
    <!--
      El tema se aplica ANTES de que React pinte: sin esto, en modo oscuro cada
      recarga arranca con un flash blanco a pantalla completa.

      Va embebido y NO en un archivo aparte. Embebido normalmente obligaría a
      poner 'unsafe-inline' en script-src —el permiso que convierte cualquier
      inyección de HTML en ejecución de código—, pero el servidor declara el
      hash sha256 exacto de este bloque: se ejecuta éste y ningún otro, sin
      abrir la puerta a los inyectados. Y así no queda una ruta pública más
      publicando cómo funciona la app.
    -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('stocker:tema');
          var o = g === 'oscuro' || (!g && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', o ? 'dark' : 'light');
          document.documentElement.style.colorScheme = o ? 'dark' : 'light';
        } catch (e) {
          /* Sin localStorage —ventana privada, cookies bloqueadas— se queda en claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stocker — Panel de gestión</title>
    <!--
      El tema se aplica ANTES de que React pinte.

      Puesto sólo en React, la primera pintura sale en claro y recién después
      cambia: en modo oscuro eso es un flash blanco a pantalla completa cada vez
      que se abre o se recarga. Son seis líneas y se ejecutan antes del primer
      pixel, así que no hay parpadeo.
    -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('stocker:tema');
          var oscuro = g === 'oscuro'
            || (!g && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
        } catch (e) { /* sin localStorage se queda en claro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

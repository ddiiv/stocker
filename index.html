<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stocker — Panel de gestión</title>
    <!--
      El tema se aplica antes de que React pinte, desde un archivo aparte.

      Aparte y no embebido por la Política de Seguridad de Contenido: permitir
      scripts embebidos obliga a 'unsafe-inline' en script-src, que es el
      permiso que convierte cualquier inyección de HTML en ejecución de código.
      Con `src` propio no hace falta. Sigue siendo bloqueante y va en el <head>,
      así que corre antes del primer pixel.
    -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
